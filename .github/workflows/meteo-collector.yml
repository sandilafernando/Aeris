
name: Aeris Meteorological Data Collector

on:
  schedule:
    # Every three hours, offset from the top of the hour.
    - cron: "23 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aeris-meteo-collector
  cancel-in-progress: false

jobs:
  collect:
    name: Download, validate and publish observations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-meteo.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-meteo.txt

      - name: Download official workbook and generate JSON
        env:
          METEO_URL: "https://meteo.gov.lk/excels/3hourly.xlsx?"
          METEO_OUTPUT: "data/meteo.json"
          METEO_MAX_RETRIES: "3"
        run: |
          set -euo pipefail
          python scripts/meteo_collector.py

      - name: Validate generated JSON
        run: |
          set -euo pipefail
          python -m json.tool data/meteo.json > /dev/null
          test -s data/meteo.json
          echo "JSON syntax validation passed."

      - name: Commit and push validated data
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/meteo.json

          if git diff --cached --quiet; then
            echo "No changes detected; nothing to publish."
            exit 0
          fi

          git commit -m "chore(data): update official meteorological observations"
          git push origin HEAD:main

      - name: Report outcome
        if: always()
        run: |
          echo "Collector job status: ${{ job.status }}"
          echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
