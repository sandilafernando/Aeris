
name: Collect Sri Lanka Meteorological Data

on:
  workflow_dispatch:
  schedule:
    - cron: "12 */3 * * *"

permissions:
  contents: write

concurrency:
  group: meteo-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      - name: Download and normalize weather observations
        env:
          METEO_EXCEL_URL: "https://meteo.gov.lk/excels/3hourly.xlsx?"
        run: |
          python - <<'PY'
          import json
          import math
          import os
          import re
          import time
          from datetime import date, datetime, timezone
          from pathlib import Path

          import requests
          from openpyxl import load_workbook

          URL = os.environ["METEO_EXCEL_URL"]
          OUTPUT = Path("data/meteo.json")
          OUTPUT.parent.mkdir(parents=True, exist_ok=True)

          def clean_text(value):
              if value is None:
                  return None
              text = str(value).replace("\xa0", " ").strip()
              return text or None

          def normalize_header(value):
              text = clean_text(value) or ""
              text = re.sub(r"\s+", " ", text)
              return text.casefold().strip()

          def json_value(value):
              if value is None:
                  return None
              if isinstance(value, (datetime, date)):
                  return value.isoformat()
              if isinstance(value, float) and not math.isfinite(value):
                  return None
              if isinstance(value, (str, int, float, bool)):
                  return value
              return str(value)

          def number(value):
              if value is None:
                  return None
              if isinstance(value, bool):
                  return None
              if isinstance(value, (int, float)):
                  return float(value) if math.isfinite(value) else None

              text = clean_text(value)
              if not text or text.casefold() in {
                  "na", "n/a", "nan", "null", "-", "--"
              }:
                  return None

              # Trace is a qualitative rainfall measurement, not zero.
              if text.casefold() in {"trace", "tr"}:
                  return None

              try:
                  result = float(text.replace(",", ""))
                  return result if math.isfinite(result) else None
              except ValueError:
                  return None

          def rainfall(value):
              text = clean_text(value)
              if text and text.casefold() in {"trace", "tr"}:
                  return {"value_mm": None, "trace": True}
              return {"value_mm": number(value), "trace": False}

          def parse_report_time(value):
              if isinstance(value, datetime):
                  return value.strftime("%Y-%m-%d %H:%M")
              if isinstance(value, date):
                  return value.strftime("%Y-%m-%d")
              text = clean_text(value)
              if not text:
                  return None

              # The source commonly uses values such as 2026-10-26 1730.
              for fmt in (
                  "%Y-%m-%d %H%M",
                  "%Y-%m-%d %H:%M",
                  "%Y/%m/%d %H%M",
                  "%Y/%m/%d %H:%M",
                  "%d/%m/%Y %H%M",
                  "%d/%m/%Y %H:%M",
              ):
                  try:
                      return datetime.strptime(text, fmt).strftime(
                          "%Y-%m-%d %H:%M"
                      )
                  except ValueError:
                      pass

              return text

          # Download with retries. Do not replace existing JSON on failure.
          response = None
          last_error = None
          session = requests.Session()
          session.headers.update({
              "User-Agent": "AerisWeatherCollector/1.0"
          })

          for attempt in range(1, 4):
              try:
                  candidate = session.get(
                      URL,
                      timeout=(20, 60),
                      allow_redirects=True
                  )
                  candidate.raise_for_status()

                  if not candidate.content.startswith(b"PK"):
                      raise ValueError(
                          "Downloaded content is not a valid-looking XLSX "
                          "file (missing ZIP signature)."
                      )

                  response = candidate
                  break
              except Exception as exc:
                  last_error = str(exc)
                  print(f"Download attempt {attempt}/3 failed: {exc}")
                  if attempt < 3:
                      time.sleep(4)

          if response is None:
              raise RuntimeError(
                  f"Could not download the official workbook: {last_error}. "
                  "Existing JSON has not been changed."
              )

          workbook_path = Path("/tmp/3hourly.xlsx")
          workbook_path.write_bytes(response.content)

          print(f"Downloaded {len(response.content)} bytes")
          print(f"Resolved URL: {response.url}")

          workbook = load_workbook(
              workbook_path,
              read_only=True,
              data_only=True
          )

          # Map source spreadsheet headings to stable Aeris JSON field names.
          aliases = {
              "station_id": {
                  "station_id", "station id", "station code"
              },
              "station_name": {
                  "station_name", "station name", "station"
              },
              "report_time": {
                  "report_time", "report time", "observation time",
                  "observed time", "date time", "datetime"
              },
              "rainfall_mm": {
                  "rainfall (mm)", "rainfall(mm)", "rainfall",
                  "rainfall mm"
              },
              "total_rainfall_since_0830_mm": {
                  "tot rf since 830am", "total rf since 830am",
                  "total rainfall since 830am",
                  "tot rf since 8:30am"
              },
              "temperature_c": {
                  "temperature ( c )", "temperature (c)",
                  "temperature (°c)", "temperature c",
                  "temperature", "temp (c)"
              },
              "relative_humidity_pct": {
                  "rh (%)", "rh%", "relative humidity (%)",
                  "relative humidity", "humidity (%)"
              },
              "weather_type": {
                  "weathertype", "weather type", "weather"
              },
              "wind_direction": {
                  "wind direction", "wind direction "
              },
              "wind_speed_kmh": {
                  "wind speed(kmh-1)", "wind speed (kmh-1)",
                  "wind speed (km/h)", "wind speed km/h",
                  "wind speed"
              },
              "cloud_cover": {
                  "cloud cover", "cloud amount"
              },
              "mean_sea_level_pressure_hpa": {
                  "mslp", "mean sea level pressure",
                  "mean sea level pressure (hpa)", "mslp (hpa)"
              },
              "dew_point_c": {
                  "dew point", "dew point (c)", "dew point (°c)"
              }
          }

          normalized_aliases = {
              field: {normalize_header(alias) for alias in values}
              for field, values in aliases.items()
          }

          def find_column(headers, field):
              for index, header in enumerate(headers):
                  if normalize_header(header) in normalized_aliases[field]:
                      return index
              return None

          observations = []
          source_sheets = []
          unmapped_columns = {}
          skipped_rows = 0

          for ws in workbook.worksheets:
              # Locate the header row in the first 30 rows.
              best = None
              for row_index, row in enumerate(
                  ws.iter_rows(
                      min_row=1,
                      max_row=min(30, ws.max_row or 1),
                      values_only=True
                  ),
                  start=1
              ):
                  headers = [clean_text(v) for v in row]
                  mapped = sum(
                      find_column(headers, field) is not None
                      for field in (
                          "station_id", "station_name", "report_time",
                          "temperature_c", "rainfall_mm"
                      )
                  )
                  if best is None or mapped > best[0]:
                      best = (mapped, row_index, headers)

              if best is None or best[0] < 2:
                  print(f"Skipping sheet without recognizable headers: {ws.title}")
                  continue

              _, header_row, headers = best
              columns = {
                  field: find_column(headers, field)
                  for field in normalized_aliases
              }

              source_sheets.append({
                  "name": ws.title,
                  "header_row": header_row,
                  "columns": [
                      header for header in headers if header is not None
                  ]
              })

              unmapped_columns[ws.title] = [
                  header for header in headers
                  if header is not None
                  and not any(
                      normalize_header(header) in aliases_for_field
                      for aliases_for_field in normalized_aliases.values()
                  )
              ]

              def get(row, field):
                  index = columns[field]
                  if index is None or index >= len(row):
                      return None
                  return row[index]

              for excel_row, row in enumerate(
                  ws.iter_rows(
                      min_row=header_row + 1,
                      values_only=True
                  ),
                  start=header_row + 1
              ):
                  station_id_raw = get(row, "station_id")
                  station_name_raw = get(row, "station_name")

                  station_id = clean_text(station_id_raw)
                  station_name = clean_text(station_name_raw)

                  if not station_id and not station_name:
                      if any(v is not None for v in row):
                          skipped_rows += 1
                      continue

                  # Avoid treating section titles or repeated headings as stations.
                  if (
                      station_id
                      and normalize_header(station_id) in {
                          "station id", "station_id"
                      }
                  ):
                      continue

                  report_time = parse_report_time(get(row, "report_time"))

                  rain = rainfall(get(row, "rainfall_mm"))
                  total_rain = rainfall(
                      get(row, "total_rainfall_since_0830_mm")
                  )

                  observation = {
                      "station_id": station_id,
                      "station_name": station_name,
                      "report_time": report_time,
                      "rainfall_mm": rain["value_mm"],
                      "rainfall_trace": rain["trace"],
                      "total_rainfall_since_0830_mm": total_rain["value_mm"],
                      "total_rainfall_trace": total_rain["trace"],
                      "temperature_c": number(get(row, "temperature_c")),
                      "relative_humidity_pct": number(
                          get(row, "relative_humidity_pct")
                      ),
                      "weather_type": clean_text(get(row, "weather_type")),
                      "wind_direction": clean_text(get(row, "wind_direction")),
                      "wind_speed_kmh": number(get(row, "wind_speed_kmh")),
                      "cloud_cover": number(get(row, "cloud_cover")),
                      "mean_sea_level_pressure_hpa": number(
                          get(row, "mean_sea_level_pressure_hpa")
                      ),
                      "dew_point_c": number(get(row, "dew_point_c")),
                      "source_sheet": ws.title,
                      "source_excel_row": excel_row
                  }

                  # Keep readings even if some measurements are missing.
                  observations.append(observation)

          workbook.close()

          if not observations:
              raise RuntimeError(
                  "No station observations were extracted. "
                  "Existing JSON has not been changed. Check workbook headers."
              )

          # Use the most common non-empty report time as the workbook's
          # reported time. Individual rows retain their own report_time.
          report_times = [
              item["report_time"]
              for item in observations
              if item["report_time"]
          ]
          latest_report_time = None
          if report_times:
              latest_report_time = max(set(report_times), key=report_times.count)

          result = {
              "source": "Sri Lanka Department of Meteorology",
              "source_url": URL,
              "downloaded_from": response.url,
              "retrieved_at": datetime.now(timezone.utc).isoformat(),
              "report_time": latest_report_time,
              "status": "success",
              "observations_verified": False,
              "format": "xlsx",
              "units": {
                  "temperature": "°C",
                  "rainfall": "mm",
                  "wind_speed": "km/h",
                  "relative_humidity": "%",
                  "pressure": "hPa",
                  "dew_point": "°C"
              },
              "total_records": len(observations),
              "station_count": len({
                  item["station_id"] or item["station_name"]
                  for item in observations
              }),
              "sheets": source_sheets,
              "unmapped_columns": unmapped_columns,
              "skipped_rows": skipped_rows,
              "stations": observations,
              "note": (
                  "Values are extracted from the downloaded official "
                  "workbook. Trace rainfall is represented as a separate "
                  "boolean and a null numeric value. Missing or NA "
                  "measurements are null. Validate units and timestamps "
                  "before marking observations as verified."
              )
          }

          temporary_output = OUTPUT.with_suffix(".json.tmp")
          temporary_output.write_text(
              json.dumps(result, ensure_ascii=False, indent=2, allow_nan=False),
              encoding="utf-8"
          )
          temporary_output.replace(OUTPUT)

          print(f"Saved {OUTPUT}")
          print(f"Observations: {len(observations)}")
          print(f"Unique stations: {result['station_count']}")
          print(f"Report time: {latest_report_time}")
          print("Conversion completed successfully.")
          PY

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/meteo.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          assert data["status"] == "success"
          assert isinstance(data["stations"], list)
          assert len(data["stations"]) > 0

          required = {
              "station_id",
              "station_name",
              "report_time",
              "temperature_c",
              "relative_humidity_pct",
              "rainfall_mm",
              "wind_speed_kmh"
          }

          for index, station in enumerate(data["stations"]):
              missing = required - station.keys()
              if missing:
                  raise ValueError(
                      f"Record {index} is missing fields: {sorted(missing)}"
                  )

          print("JSON validation passed.")
          print(f"Records: {len(data['stations'])}")
          PY

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/meteo.json

          if git diff --cached --quiet; then
            echo "No changes to weather data."
          else
            git commit -m "Update Sri Lanka weather observations"
            git push
          fi
