
name: Collect Sri Lanka Weather Observations

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meteo-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download official weather page
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 \
            --connect-timeout 20 \
            --max-time 60 \
            "https://meteo.gov.lk/" \
            --output /tmp/meteo-home.html

      - name: Extract and validate observations
        run: |
          python - <<'PY'
          import json
          import math
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          from pathlib import Path

          class WeatherParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.observations = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)

                  if tag != "div":
                      return

                  if "district-point" not in attrs.get("class", "").split():
                      return

                  name = attrs.get("data-name")
                  raw = attrs.get("data-weather")

                  if not name or not raw:
                      return

                  try:
                      weather = json.loads(raw)
                  except json.JSONDecodeError:
                      return

                  self.observations.append({
                      "station_name": name.strip(),
                      "last_updated": weather.get("lastUpdated"),
                      "rainfall_raw": weather.get("rainfall"),
                      "total_rainfall_raw": weather.get("totalRainfall"),
                      "temperature_c": weather.get("temp"),
                      "relative_humidity_pct": weather.get("rh"),
                      "weather_type": weather.get("forecast")
                  })

          def number_or_none(value):
              if value is None:
                  return None

              if str(value).strip().casefold() == "trace":
                  return None

              try:
                  result = float(value)
                  return result if math.isfinite(result) else None
              except (TypeError, ValueError):
                  return None

          html = Path("/tmp/meteo-home.html").read_text(
              encoding="utf-8"
          )

          parser = WeatherParser()
          parser.feed(html)

          records = parser.observations

          # Fail safely if the source page changes or returns
          # an incomplete page. Do not replace existing JSON.
          if len(records) < 10:
              raise SystemExit(
                  f"Only {len(records)} stations found; "
                  "refusing to publish incomplete data."
              )

          names = [r["station_name"].casefold() for r in records]
          if len(names) != len(set(names)):
              raise SystemExit("Duplicate station names detected.")

          for record in records:
              rainfall = record.pop("rainfall_raw")
              total_rainfall = record.pop("total_rainfall_raw")

              record["rainfall_mm"] = number_or_none(rainfall)
              record["rainfall_trace"] = (
                  str(rainfall).strip().casefold() == "trace"
              )
              record["total_rainfall_since_0830_mm"] = (
                  number_or_none(total_rainfall)
              )
              record["total_rainfall_trace"] = (
                  str(total_rainfall).strip().casefold() == "trace"
              )
              record["temperature_c"] = number_or_none(
                  record["temperature_c"]
              )
              record["relative_humidity_pct"] = number_or_none(
                  record["relative_humidity_pct"]
              )

          output = {
              "source": "Sri Lanka Department of Meteorology",
              "source_url": "https://meteo.gov.lk/",
              "fetched_at": datetime.now(timezone.utc).isoformat(),
              "station_count": len(records),
              "observations": records
          }

          destination = Path("data/meteo-observations.json")
          destination.parent.mkdir(parents=True, exist_ok=True)

          temporary = destination.with_suffix(".json.tmp")
          temporary.write_text(
              json.dumps(output, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )

          # Replace the published file only after successful validation.
          temporary.replace(destination)

          print(f"Validated {len(records)} station observations.")
          print(f"Output: {destination}")
          PY

      - name: Commit updated observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/meteo-observations.json

          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update official weather observations"
            git push
          fi
