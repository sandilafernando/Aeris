
name: Aeris Meteorological Data Collector

on:
  schedule:
    - cron: "23 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aeris-meteo-collector
  cancel-in-progress: false

jobs:
  collect:
    name: Download, convert and publish observations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install requests openpyxl

      - name: Prepare directories
        run: mkdir -p data .cache

      - name: Download official Excel workbook
        env:
          METEO_URL: "https://meteo.gov.lk/excels/3hourly.xlsx?"
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import sys
          import time
          from pathlib import Path

          import requests
          from openpyxl import load_workbook

          url = os.environ["METEO_URL"]
          destination = Path(".cache/3hourly.xlsx")
          temporary = destination.with_suffix(".download")

          session = requests.Session()
          session.headers.update({
              "User-Agent": "AerisWeatherCollector/1.0",
              "Accept": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,*/*",
          })

          last_error = None

          for attempt in range(1, 4):
              try:
                  print(f"Download attempt {attempt}/3")

                  with session.get(
                      url,
                      timeout=(15, 60),
                      allow_redirects=True,
                      stream=True,
                  ) as response:
                      response.raise_for_status()

                      content_type = response.headers.get("Content-Type", "")
                      temporary.unlink(missing_ok=True)

                      total = 0
                      with temporary.open("wb") as output:
                          for chunk in response.iter_content(64 * 1024):
                              if chunk:
                                  output.write(chunk)
                                  total += len(chunk)

                      if total < 1000:
                          raise ValueError(
                              f"Downloaded file is unexpectedly small: {total} bytes"
                          )

                      with temporary.open("rb") as file:
                          if file.read(4) != b"PK\x03\x04":
                              raise ValueError(
                                  f"Response is not an XLSX ZIP workbook. "
                                  f"Content-Type: {content_type}"
                              )

                      workbook = load_workbook(
                          temporary,
                          read_only=True,
                          data_only=True,
                      )
                      try:
                          if not workbook.sheetnames:
                              raise ValueError("Workbook contains no worksheets.")
                          print("Workbook sheets:", workbook.sheetnames)
                      finally:
                          workbook.close()

                      destination.parent.mkdir(parents=True, exist_ok=True)
                      temporary.replace(destination)
                      print(f"Workbook downloaded and verified: {total} bytes")
                      break

              except Exception as exc:
                  last_error = exc
                  temporary.unlink(missing_ok=True)
                  print(f"Attempt {attempt} failed: {exc}", file=sys.stderr)

                  if attempt < 3:
                      time.sleep(attempt * 5)
          else:
              raise SystemExit(
                  f"Unable to download a valid official workbook after 3 attempts: "
                  f"{last_error}"
              )
          PY

      - name: Convert workbook to JSON
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import math
          import os
          import re
          import sys
          from datetime import date, datetime, timezone
          from pathlib import Path

          from openpyxl import load_workbook

          workbook_path = Path(".cache/3hourly.xlsx")
          output_path = Path("data/meteo.json")
          temporary_path = output_path.with_suffix(".json.tmp")

          headers_required = {
              "Station_ID",
              "Station_Name",
              "Report_Time",
              "Rainfall (mm)",
              "Tot RF since 830am",
              "Temperature ( C )",
              "RH (%)",
              "weathertype",
              "Wind Direction",
              "Wind Speed(kmh-1)",
              "Cloud Cover",
              "MSLP",
              "Dew Point",
          }

          def normalize_header(value):
              if value is None:
                  return ""
              return re.sub(r"\s+", " ", str(value).strip()).casefold()

          def clean_text(value):
              if value is None:
                  return None
              value = str(value).strip()
              return value or None

          def numeric(value):
              if value is None:
                  return None, False

              if isinstance(value, bool):
                  return None, False

              if isinstance(value, (int, float)):
                  if not math.isfinite(value):
                      return None, False
                  return value, False

              text = str(value).strip()
              if not text or text.casefold() in {
                  "na", "n/a", "nan", "null", "-", "--", "nil"
              }:
                  return None, False

              if text.casefold() in {"trace", "tr"}:
                  return None, True

              try:
                  value = float(text.replace(",", ""))
                  if not math.isfinite(value):
                      return None, False
                  return value, False
              except ValueError:
                  return None, False

          def iso_value(value):
              if value is None:
                  return None
              if isinstance(value, (datetime, date)):
                  return value.isoformat()
              return str(value).strip() or None

          workbook = load_workbook(
              workbook_path,
              read_only=True,
              data_only=True,
          )

          try:
              selected = None
              selected_headers = None

              for sheet in workbook.worksheets:
                  for row_number, row in enumerate(
                      sheet.iter_rows(min_row=1, max_row=20, values_only=True),
                      start=1,
                  ):
                      mapped = {}
                      for index, value in enumerate(row):
                          key = normalize_header(value)
                          if key:
                              mapped[key] = index

                      missing = {
                          normalize_header(name)
                          for name in headers_required
                      } - mapped.keys()

                      if not missing:
                          selected = sheet
                          selected_headers = mapped
                          header_row = row_number
                          break

                  if selected is not None:
                      break

              if selected is None:
                  raise SystemExit(
                      "Could not find a worksheet with all required station "
                      "columns in its first 20 rows. Refusing to publish."
                  )

              print(f"Using worksheet: {selected.title}; header row: {header_row}")

              def get(row, header):
                  index = selected_headers[normalize_header(header)]
                  return row[index] if index < len(row) else None

              records = []
              seen_station_ids = set()
              skipped_rows = 0

              for row in selected.iter_rows(
                  min_row=header_row + 1,
                  values_only=True,
              ):
                  station_id_raw = get(row, "Station_ID")
                  station_name = clean_text(get(row, "Station_Name"))

                  if station_id_raw is None and station_name is None:
                      continue

                  if station_id_raw is None or station_name is None:
                      skipped_rows += 1
                      continue

                  station_id = str(station_id_raw).strip()
                  if isinstance(station_id_raw, float) and station_id_raw.is_integer():
                      station_id = str(int(station_id_raw))

                  if not station_id:
                      skipped_rows += 1
                      continue

                  rainfall, rainfall_trace = numeric(get(row, "Rainfall (mm)"))
                  total_rainfall, total_trace = numeric(
                      get(row, "Tot RF since 830am")
                  )
                  temperature, _ = numeric(get(row, "Temperature ( C )"))
                  humidity, _ = numeric(get(row, "RH (%)"))
                  wind_speed, _ = numeric(get(row, "Wind Speed(kmh-1)"))
                  pressure, _ = numeric(get(row, "MSLP"))
                  dew_point, _ = numeric(get(row, "Dew Point"))

                  record = {
                      "station_id": station_id,
                      "station_name": station_name,
                      "report_time": iso_value(get(row, "Report_Time")),
                      "rainfall_mm": rainfall,
                      "rainfall_trace": rainfall_trace,
                      "total_rainfall_since_0830_mm": total_rainfall,
                      "total_rainfall_trace": total_trace,
                      "temperature_c": temperature,
                      "relative_humidity_pct": humidity,
                      "weather_type": clean_text(get(row, "weathertype")),
                      "wind_direction": clean_text(get(row, "Wind Direction")),
                      "wind_speed_kmh": wind_speed,
                      "cloud_cover": clean_text(get(row, "Cloud Cover")),
                      "mean_sea_level_pressure_hpa": pressure,
                      "dew_point_c": dew_point,
                  }

                  if humidity is not None and not 0 <= humidity <= 100:
                      raise SystemExit(
                          f"Invalid relative humidity for station {station_id}: {humidity}"
                      )

                  if rainfall is not None and rainfall < 0:
                      raise SystemExit(
                          f"Negative rainfall for station {station_id}"
                      )

                  records.append(record)
                  seen_station_ids.add(station_id)

              if not records:
                  raise SystemExit("No valid station observations found.")

              if len(records) < 5:
                  raise SystemExit(
                      f"Only {len(records)} station records found; refusing to "
                      "publish potentially incomplete data."
                  )

              metadata = {
                  "source_url": os.environ.get(
                      "METEO_URL",
                      "https://meteo.gov.lk/excels/3hourly.xlsx?",
                  ),
                  "retrieved_at": datetime.now(timezone.utc).isoformat(),
                  "record_count": len(records),
                  "station_count": len(seen_station_ids),
                  "worksheet": selected.title,
              }

              payload = {
                  "metadata": metadata,
                  "observations": records,
              }

              output_path.parent.mkdir(parents=True, exist_ok=True)

              with temporary_path.open("w", encoding="utf-8") as file:
                  json.dump(
                      payload,
                      file,
                      ensure_ascii=False,
                      indent=2,
                      allow_nan=False,
                  )
                  file.write("\n")

              with temporary_path.open("r", encoding="utf-8") as file:
                  checked = json.load(file)

              if len(checked["observations"]) != len(records):
                  raise SystemExit("Generated JSON record-count mismatch.")

              if checked["metadata"]["record_count"] != len(records):
                  raise SystemExit("Generated JSON metadata mismatch.")

              # Preserve the previous file unless conversion and validation succeed.
              temporary_path.replace(output_path)

              print(f"Validated {len(records)} observations.")
              print(f"Unique stations: {len(seen_station_ids)}")
              print(f"Skipped incomplete rows: {skipped_rows}")
              print(f"Generated: {output_path}")

          finally:
              workbook.close()
          PY

      - name: Final JSON validation
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/meteo.json")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("JSON output is missing or empty.")

          with path.open(encoding="utf-8") as file:
              data = json.load(file)

          if not isinstance(data, dict):
              raise SystemExit("JSON root must be an object.")

          records = data.get("observations")
          metadata = data.get("metadata")

          if not isinstance(records, list) or len(records) < 5:
              raise SystemExit("Missing or insufficient station observations.")

          if not isinstance(metadata, dict):
              raise SystemExit("Missing JSON metadata.")

          required = {
              "station_id",
              "station_name",
              "report_time",
              "rainfall_mm",
              "rainfall_trace",
              "total_rainfall_since_0830_mm",
              "total_rainfall_trace",
              "temperature_c",
              "relative_humidity_pct",
              "weather_type",
              "wind_direction",
              "wind_speed_kmh",
              "cloud_cover",
              "mean_sea_level_pressure_hpa",
              "dew_point_c",
          }

          for index, record in enumerate(records):
              if not isinstance(record, dict):
                  raise SystemExit(f"Invalid record at index {index}.")

              missing = required - record.keys()
              if missing:
                  raise SystemExit(
                      f"Record {index} is missing: {sorted(missing)}"
                  )

              if not str(record["station_id"]).strip():
                  raise SystemExit(f"Empty station ID at index {index}.")

              if not str(record["station_name"]).strip():
                  raise SystemExit(f"Empty station name at index {index}.")

              if not isinstance(record["rainfall_trace"], bool):
                  raise SystemExit(f"Invalid rainfall_trace at index {index}.")

              if not isinstance(record["total_rainfall_trace"], bool):
                  raise SystemExit(f"Invalid total_rainfall_trace at index {index}.")

          if metadata.get("record_count") != len(records):
              raise SystemExit("Metadata record_count does not match output.")

          print(f"Validation passed: {len(records)} records.")
          PY

      - name: Commit and push validated JSON
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data/meteo.json

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "chore(data): update official weather observations"
          git push origin HEAD:main

      - name: Report result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "Collector status: ${JOB_STATUS}"
          echo "Run details: ${RUN_URL}"
