
name: Collect Sri Lanka Weather Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: meteo-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch and filter official website
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          from datetime import datetime, timezone
          from urllib.parse import urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup

          SOURCES = [
              "https://www.meteo.gov.lk/index.php?lang=en",
              "https://meteo.gov.lk/",
              "https://meteo.gov.lk/qris/",
          ]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "SriLankaWeatherCollector/1.0 (GitHub Actions)"
          })

          result = {
              "source": "Sri Lanka Department of Meteorology",
              "retrieved_at": datetime.now(timezone.utc).isoformat(),
              "status": "unavailable",
              "observations_verified": False,
              "note": (
                  "This is filtered webpage content, not verified live "
                  "weather observations. A confirmed data endpoint is needed "
                  "for reliable numerical weather data."
              ),
              "page_url": None,
              "title": None,
              "text": [],
              "links": [],
              "images": [],
              "javascript_files": [],
              "attempts": [],
          }

          for url in SOURCES:
              try:
                  response = session.get(
                      url,
                      timeout=(10, 20),
                      allow_redirects=True
                  )
                  response.raise_for_status()

                  content_type = response.headers.get("Content-Type", "")
                  if "html" not in content_type.lower():
                      raise ValueError(
                          f"Unexpected content type: {content_type}"
                      )

                  soup = BeautifulSoup(response.text, "html.parser")

                  # Collect script URLs BEFORE removing scripts.
                  scripts = []
                  for tag in soup.find_all("script", src=True):
                      scripts.append(
                          urljoin(response.url, tag["src"])
                      )

                  title = soup.title.get_text(" ", strip=True) if soup.title else None

                  links = []
                  for tag in soup.find_all("a", href=True):
                      label = tag.get_text(" ", strip=True)
                      href = urljoin(response.url, tag["href"])
                      if urlparse(href).scheme in ("http", "https"):
                          links.append({
                              "text": label[:200],
                              "url": href
                          })

                  images = []
                  for tag in soup.find_all("img", src=True):
                      images.append({
                          "alt": tag.get("alt", ""),
                          "url": urljoin(response.url, tag["src"])
                      })

                  for tag in soup([
                      "script", "style", "noscript",
                      "svg", "header", "footer"
                  ]):
                      tag.decompose()

                  text = soup.get_text(" ", strip=True)
                  text = re.sub(r"\s+", " ", text)

                  # Keep relevant weather-related text fragments.
                  keywords = re.compile(
                      r"weather|temperature|rain|rainfall|wind|humidity|"
                      r"forecast|observation|satellite|cloud|visibility|"
                      r"sunrise|sunset|colombo|sri lanka|district",
                      re.IGNORECASE
                  )

                  fragments = re.split(r"(?<=[.!?])\s+", text)
                  filtered_text = [
                      fragment[:500]
                      for fragment in fragments
                      if keywords.search(fragment)
                  ]

                  result.update({
                      "status": "success",
                      "page_url": response.url,
                      "title": title,
                      "text": filtered_text[:200],
                      "links": links[:300],
                      "images": images[:100],
                      "javascript_files": list(dict.fromkeys(scripts))[:100],
                      "attempts": result["attempts"],
                  })
                  break

              except Exception as exc:
                  result["attempts"].append({
                      "url": url,
                      "error": str(exc)[:500]
                  })
                  time.sleep(2)

          os.makedirs("data", exist_ok=True)
          with open("data/meteo.json", "w", encoding="utf-8") as file:
              json.dump(result, file, ensure_ascii=False, indent=2)

          print("Collector status:", result["status"])
          print("Saved data/meteo.json")
          PY

      - name: Commit JSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meteo.json
          if ! git diff --cached --quiet; then
            git commit -m "Update collected weather source data"
            git push
          else
            echo "No changes to commit."
          fi
