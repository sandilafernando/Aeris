
name: Diagnose Sri Lanka Meteorology Connectivity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  diagnose:
    name: Test Meteorology Server Access
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Show runner information
        run: |
          echo "=== Runner information ==="
          uname -a
          echo "UTC time:"
          date -u

      - name: Diagnose DNS resolution
        run: |
          echo "=== DNS: meteo.gov.lk ==="
          getent ahosts meteo.gov.lk || true

          echo
          echo "=== DNS: weather.meteo.gov.lk ==="
          getent ahosts weather.meteo.gov.lk || true

      - name: Test HTTPS using hostname
        run: |
          echo "=== HTTPS by hostname ==="
          curl -v -I \
            --connect-timeout 20 \
            --max-time 35 \
            https://meteo.gov.lk/ || true

      - name: Test HTTPS using known IP
        run: |
          echo "=== HTTPS using IP 222.165.186.50 ==="
          curl -v -I \
            --connect-timeout 20 \
            --max-time 35 \
            --resolve meteo.gov.lk:443:222.165.186.50 \
            https://meteo.gov.lk/ || true

      - name: Test alternate hostname
        run: |
          echo "=== HTTPS: www.meteo.gov.lk ==="
          curl -v -I \
            --connect-timeout 15 \
            --max-time 25 \
            https://www.meteo.gov.lk/ || true

      - name: Show GitHub runner public IP
        run: |
          echo "=== Runner public IP ==="
          curl -fsS \
            --connect-timeout 10 \
            --max-time 15 \
            https://api.ipify.org || true
          echo

      - name: Test official weather page download
        run: |
          echo "=== Download homepage ==="
          if curl --fail --silent --show-error --location \
            --connect-timeout 20 \
            --max-time 45 \
            --output /tmp/meteo-home.html \
            https://meteo.gov.lk/; then
            echo "Download succeeded."
            echo "Downloaded bytes:"
            wc -c < /tmp/meteo-home.html
            echo "Station entries found:"
            grep -o 'district-point' /tmp/meteo-home.html | wc -l
          else
            echo "Download failed."
          fi
