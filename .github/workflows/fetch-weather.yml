
name: Fetch Sri Lanka Weather Observations

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aeris-weather-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10

    steps:
      - name: Checkout Aeris
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and filter official weather observations
        env:
          METEO_URL: https://meteo.gov.lk/
          OUTPUT_FILE: data/meteo.json
          MAX_RETRIES: '3'
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          URL = os.environ["METEO_URL"]
          OUTPUT = Path(os.environ["OUTPUT_FILE"])
          RETRIES = int(os.environ.get("MAX_RETRIES", "3"))
          SL_TZ = ZoneInfo("Asia/Colombo")

          def parse_station_time(value):
              if not isinstance(value, str):
                  return None

              value = value.strip()
              formats = (
                  "%Y-%m-%d %H%M",
                  "%Y-%m-%d %H:%M",
                  "%Y-%m-%d %H:%M:%S",
                  "%Y-%m-%dT%H:%M:%S%z",
                  "%Y-%m-%dT%H:%M:%S",
              )

              for fmt in formats:
                  try:
                      parsed = datetime.strptime(value, fmt)
                      if parsed.tzinfo is None:
                          parsed = parsed.replace(tzinfo=SL_TZ)
                      return parsed.astimezone(SL_TZ)
                  except ValueError:
                      continue

              return None

          class StationParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stations = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "div":
                      return

                  attrs = dict(attrs)
                  classes = (attrs.get("class") or "").split()

                  if "district-point" not in classes:
                      return

                  name = (attrs.get("data-name") or "").strip().upper()
                  raw = attrs.get("data-weather")

                  if not name or not raw:
                      return

                  try:
                      weather = json.loads(raw)
                  except (json.JSONDecodeError, TypeError):
                      print(f"Skipping {name}: invalid weather JSON")
                      return

                  if not isinstance(weather, dict):
                      return

                  allowed = {
                      "lastUpdated",
                      "rainfall",
                      "totalRainfall",
                      "temp",
                      "rh",
                      "forecast",
                  }

                  filtered = {
                      key: value
                      for key, value in weather.items()
                      if key in allowed
                      and value is not None
                      and str(value).strip() not in ("", "-")
                  }

                  # Do not accept a station containing only a timestamp.
                  if not any(
                      key != "lastUpdated"
                      for key in filtered
                  ):
                      return

                  self.stations.append({
                      "name": name,
                      "weather": filtered,
                  })

          html = None
          last_error = None

          for attempt in range(1, RETRIES + 1):
              try:
                  request = Request(
                      URL,
                      headers={
                          "User-Agent": "AerisWeatherCollector/1.0",
                          "Accept": "text/html",
                      },
                  )

                  with urlopen(request, timeout=25) as response:
                      if response.status != 200:
                          raise RuntimeError(
                              f"HTTP status {response.status}"
                          )
                      html = response.read().decode(
                          "utf-8", errors="replace"
                      )

                  break
              except Exception as exc:
                  last_error = exc
                  print(f"Attempt {attempt}/{RETRIES} failed: {exc}")
                  if attempt < RETRIES:
                      time.sleep(attempt * 3)

          if html is None:
              raise SystemExit(
                  f"Could not fetch official website: {last_error}"
              )

          parser = StationParser()
          parser.feed(html)

          # Deduplicate stations, retaining the last record per station.
          unique = {}
          for station in parser.stations:
              unique[station["name"]] = station

          stations = sorted(
              unique.values(), key=lambda station: station["name"]
          )

          if not stations:
              raise SystemExit(
                  "No valid station observations found. "
                  "Keeping the previous published dataset unchanged."
              )

          # Find the newest station-provided observation timestamp.
          dated_stations = []
          for station in stations:
              raw_time = station["weather"].get("lastUpdated")
              parsed_time = parse_station_time(raw_time)
              if parsed_time:
                  dated_stations.append((parsed_time, raw_time))

          latest_observation_raw = None
          latest_observation_sl = None

          if dated_stations:
              latest_parsed, latest_observation_raw = max(
                  dated_stations, key=lambda item: item[0]
              )
              latest_observation_sl = latest_parsed.isoformat()

          fetched_utc = datetime.now(timezone.utc)
          fetched_sl = fetched_utc.astimezone(SL_TZ)

          result = {
              "source": URL,
              "fetchedAt": fetched_utc.isoformat(),
              "fetchedAtSriLanka": fetched_sl.isoformat(),
              "fetchedAtSriLankaDisplay": fetched_sl.strftime(
                  "%Y-%m-%d %H:%M:%S"
              ),
              "timezone": "Asia/Colombo",
              "meteoLatestObservationUpdatedAt": latest_observation_raw,
              "meteoLatestObservationUpdatedAtSriLanka": (
                  latest_observation_sl
              ),
              "stationCount": len(stations),
              "stations": stations,
          }

          OUTPUT.parent.mkdir(parents=True, exist_ok=True)
          temporary = OUTPUT.with_suffix(".json.tmp")
          temporary.write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          temporary.replace(OUTPUT)

          print(f"Saved {len(stations)} stations to {OUTPUT}")
          print(
              "Fetched from website (Sri Lanka time): "
              f"{result['fetchedAtSriLankaDisplay']}"
          )
          print(
              "Latest station observation timestamp: "
              f"{latest_observation_raw or 'Not supplied'}"
          )
          PY

      - name: Validate weather JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/meteo.json")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("Weather JSON is missing or empty")

          data = json.loads(path.read_text(encoding="utf-8"))
          stations = data.get("stations")

          if not isinstance(stations, list) or not stations:
              raise SystemExit("No valid station records")

          if data.get("stationCount") != len(stations):
              raise SystemExit("Station count does not match records")

          required = {"name", "weather"}
          for station in stations:
              if not required.issubset(station):
                  raise SystemExit("Invalid station record")
              if not isinstance(station["weather"], dict):
                  raise SystemExit("Invalid station weather data")

          print(f"Validated {len(stations)} station records.")
          print("Fetched at (Sri Lanka time):",
                data.get("fetchedAtSriLankaDisplay"))
          print("Latest station update:",
                data.get("meteoLatestObservationUpdatedAt"))
          PY

      - name: Commit and publish updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/meteo.json

          if git diff --cached --quiet; then
            echo "No changes to weather data; no commit needed."
          else
            git commit -m "Update official Sri Lanka weather observations"
            git push origin HEAD:main
          fi
