name: Fetch Sri Lanka Weather Observations

on:
  schedule:
    # Fetch official observations every 15 minutes, all day.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-sri-lanka-weather
  cancel-in-progress: false

jobs:
  fetch-weather:
    name: Fetch and publish official weather observations
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch and refresh official weather JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request
          from datetime import datetime
          from html.parser import HTMLParser
          from pathlib import Path
          from zoneinfo import ZoneInfo

          SOURCE_URL = "https://meteo.gov.lk/"
          OUTPUT = Path("data/meteo.json")
          SL = ZoneInfo("Asia/Colombo")
          UTC = ZoneInfo("UTC")

          class WeatherParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stations = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "div":
                      return

                  attrs = dict(attrs)
                  classes = (attrs.get("class") or "").split()

                  if "district-point" not in classes:
                      return

                  name = (attrs.get("data-name") or "").strip()
                  raw = attrs.get("data-weather")

                  if not name or not raw:
                      return

                  try:
                      weather = json.loads(raw)
                  except (json.JSONDecodeError, TypeError):
                      print(f"Skipping invalid station JSON: {name}")
                      return

                  if not isinstance(weather, dict):
                      return

                  fields = (
                      "lastUpdated",
                      "rainfall",
                      "totalRainfall",
                      "temp",
                      "rh",
                      "forecast",
                  )

                  cleaned = {
                      key: weather[key]
                      for key in fields
                      if key in weather and weather[key] is not None
                  }

                  if cleaned:
                      self.stations.append({
                          "name": name,
                          "weather": cleaned,
                      })

          def parse_time(value):
              if value is None:
                  return None

              value = str(value).strip()

              formats = (
                  "%Y-%m-%d %H%M",
                  "%Y-%m-%d %H:%M",
                  "%Y-%m-%d %H:%M:%S",
              )

              for fmt in formats:
                  try:
                      return datetime.strptime(value, fmt).replace(tzinfo=SL)
                  except ValueError:
                      pass

              try:
                  parsed = datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  )

                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=SL)

                  return parsed.astimezone(SL)
              except ValueError:
                  return None

          def load_previous():
              try:
                  with OUTPUT.open("r", encoding="utf-8") as file:
                      obj = json.load(file)

                  if (
                      isinstance(obj, dict)
                      and isinstance(obj.get("stations"), list)
                  ):
                      return obj

              except (OSError, json.JSONDecodeError) as exc:
                  print(f"No usable previous JSON: {exc}")

              return None

          def index_stations(stations):
              indexed = {}

              for station in stations:
                  if not isinstance(station, dict):
                      continue

                  name = str(station.get("name") or "").strip()
                  weather = station.get("weather")

                  if name and isinstance(weather, dict):
                      indexed[name.casefold()] = {
                          "name": name,
                          "weather": weather,
                      }

              return indexed

          def latest_time(stations):
              timestamps = []

              for station in stations:
                  weather = station.get("weather", {})
                  parsed = parse_time(weather.get("lastUpdated"))

                  if parsed is not None:
                      timestamps.append(parsed)

              return max(timestamps) if timestamps else None

          # Capture the fetch time independently of observation time.
          fetched_utc = datetime.now(UTC)
          fetched_sl = fetched_utc.astimezone(SL)

          # Use no-cache headers and a unique query parameter to reduce
          # the chance of receiving a cached homepage response.
          request_url = (
              SOURCE_URL
              + "?_aeris_cache_bust="
              + str(int(time.time()))
          )

          request = urllib.request.Request(
              request_url,
              headers={
                  "User-Agent": "AerisWeatherCollector/2.0",
                  "Accept": "text/html",
                  "Cache-Control": "no-cache, no-store, max-age=0",
                  "Pragma": "no-cache",
              },
          )

          html = None
          last_error = None

          for attempt in range(1, 4):
              try:
                  with urllib.request.urlopen(
                      request, timeout=25
                  ) as response:
                      status = getattr(response, "status", 200)

                      if status != 200:
                          raise RuntimeError(
                              f"Official site returned HTTP {status}"
                          )

                      html = response.read().decode(
                          "utf-8", errors="replace"
                      )

                  if not html.strip():
                      raise RuntimeError("Official website returned an empty page")

                  break

              except Exception as exc:
                  last_error = exc
                  print(f"Fetch attempt {attempt}/3 failed: {exc}")

                  if attempt < 3:
                      time.sleep(attempt * 3)

          if html is None:
              raise RuntimeError(
                  f"Could not retrieve official observations: {last_error}"
              )

          parser = WeatherParser()
          parser.feed(html)
          parser.close()

          incoming = {}

          for station in parser.stations:
              key = station["name"].strip().casefold()
              incoming[key] = station

          # Never replace valid JSON with an empty or invalid scrape.
          if not incoming:
              raise RuntimeError(
                  "No valid station observations found. "
                  "The existing JSON was left untouched."
              )

          previous = load_previous()
          old_stations = index_stations(
              previous.get("stations", []) if previous else []
          )

          incoming_latest = latest_time(list(incoming.values()))

          # Require at least one recognizable source observation time.
          # A successful download alone does not prove the source data
          # is current.
          if incoming_latest is None:
              raise RuntimeError(
                  "No recognizable lastUpdated timestamp found. "
                  "The existing JSON was left untouched."
              )

          print("Official source:", SOURCE_URL)
          print("Fetch time (Sri Lanka):", fetched_sl.isoformat())
          print("Incoming stations:", len(incoming))
          print("Latest source observation:", incoming_latest.isoformat())

          # Merge station-by-station. Do not discard good readings just
          # because the source omits a station or serves an older reading.
          merged = dict(old_stations)
          accepted = 0
          preserved_older = 0

          for key, new_station in incoming.items():
              old_station = old_stations.get(key)

              if old_station is None:
                  merged[key] = new_station
                  accepted += 1
                  continue

              old_weather = old_station["weather"]
              new_weather = new_station["weather"]

              old_time = parse_time(old_weather.get("lastUpdated"))
              new_time = parse_time(new_weather.get("lastUpdated"))

              if old_time is not None and (
                  new_time is None or new_time < old_time
              ):
                  preserved_older += 1
                  continue

              # Same-time readings may contain updated rainfall or
              # other values, so accept them when the payload changes.
              if new_weather != old_weather:
                  merged[key] = new_station
                  accepted += 1

          stations = sorted(
              merged.values(),
              key=lambda station: station["name"].casefold()
          )

          if not stations:
              raise RuntimeError("Merged station list is empty.")

          latest = latest_time(stations)

          if latest is None:
              raise RuntimeError(
                  "Merged data has no valid source observation timestamp."
              )

          result = {
              "source": SOURCE_URL,
              "fetchedAt": fetched_utc.isoformat(),
              "fetchedAtSriLanka": fetched_sl.isoformat(),
              "fetchedAtSriLankaDisplay": fetched_sl.strftime(
                  "%Y-%m-%d %H:%M:%S"
              ),
              "timezone": "Asia/Colombo",
              "stationCount": len(stations),
              "meteoLatestObservationUpdatedAt": latest.strftime(
                  "%Y-%m-%d %H:%M:%S"
              ),
              "meteoLatestObservationUpdatedAtSriLanka": latest.isoformat(),
              "stations": stations,
          }

          OUTPUT.parent.mkdir(parents=True, exist_ok=True)
          temporary = OUTPUT.with_suffix(".json.tmp")

          try:
              with temporary.open("w", encoding="utf-8") as file:
                  json.dump(
                      result,
                      file,
                      ensure_ascii=False,
                      indent=2,
                  )
                  file.write("\n")

              # Validate before replacing the existing JSON.
              with temporary.open("r", encoding="utf-8") as file:
                  checked = json.load(file)

              if not isinstance(checked.get("stations"), list):
                  raise RuntimeError("Invalid JSON stations field.")

              if not checked["stations"]:
                  raise RuntimeError("JSON validation found no stations.")

              if checked.get("stationCount") != len(checked["stations"]):
                  raise RuntimeError("Station count validation failed.")

              if not checked.get("fetchedAt"):
                  raise RuntimeError("Missing fetch timestamp.")

              if not checked.get("meteoLatestObservationUpdatedAtSriLanka"):
                  raise RuntimeError("Missing observation timestamp.")

              # Replace atomically after successful validation.
              os.replace(temporary, OUTPUT)

          finally:
              if temporary.exists():
                  temporary.unlink()

          print("JSON refreshed successfully:", OUTPUT)
          print("Station count:", len(stations))
          print("New/changed stations accepted:", accepted)
          print("Older station readings preserved:", preserved_older)
          print("Fetch time:", result["fetchedAtSriLankaDisplay"])
          print("Latest source observation:", latest.isoformat())
          print("The JSON is refreshed even when observations are unchanged.")
          PY

      - name: Commit and push refreshed JSON
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/meteo.json

          # fetchedAt changes after every successful fetch, so this
          # normally produces a commit every 15 minutes.
          if git diff --cached --quiet; then
            echo "JSON is identical; no commit needed."
            exit 0
          fi

          git commit -m "Refresh official Sri Lanka weather data"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "SUCCESS: refreshed JSON pushed to main."
              exit 0
            fi

            echo "Push attempt ${attempt}/3 failed; syncing with main."
            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase failed. Manual conflict resolution is required." >&2
              exit 1
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 3
            fi
          done

          echo "ERROR: unable to push refreshed JSON." >&2
          exit 1
