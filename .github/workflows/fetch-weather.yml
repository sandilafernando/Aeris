name: Fetch Sri Lanka Weather Observations

on:
  schedule:
    # Check every five minutes, Sri Lanka time.
    # The collector decides whether a target update window is active.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-sri-lanka-weather
  cancel-in-progress: false

jobs:
  fetch-weather:
    name: Fetch and publish official weather observations
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 4

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch, validate and update official observations
        id: collect
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import re
          import sys
          import time
          import urllib.request
          from datetime import datetime, timedelta
          from html.parser import HTMLParser
          from pathlib import Path
          from zoneinfo import ZoneInfo

          URL = "https://meteo.gov.lk/"
          OUTPUT = Path("data/meteo.json")
          SL = ZoneInfo("Asia/Colombo")
          UTC = ZoneInfo("UTC")

          # Official observation targets in Sri Lanka time.
          # Every five-minute scheduled run checks whether the current
          # target's publication window is active.
          TARGET_MINUTES = (330, 510, 690, 870, 1050, 1230, 1410, 150)
          WINDOW_MINUTES = 180

          class WeatherParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stations = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "div":
                      return

                  attrs = dict(attrs)
                  classes = (attrs.get("class") or "").split()

                  if "district-point" not in classes:
                      return

                  name = (attrs.get("data-name") or "").strip()
                  raw = attrs.get("data-weather")

                  if not name or not raw:
                      return

                  try:
                      weather = json.loads(raw)
                  except (json.JSONDecodeError, TypeError):
                      return

                  if not isinstance(weather, dict):
                      return

                  allowed = (
                      "lastUpdated",
                      "rainfall",
                      "totalRainfall",
                      "temp",
                      "rh",
                      "forecast",
                  )

                  cleaned = {
                      key: weather[key]
                      for key in allowed
                      if key in weather and weather[key] is not None
                  }

                  if cleaned:
                      self.stations.append({
                          "name": name,
                          "weather": cleaned,
                      })

          def parse_time(value):
              if value is None:
                  return None

              value = str(value).strip()
              formats = (
                  "%Y-%m-%d %H%M",
                  "%Y-%m-%d %H:%M",
                  "%Y-%m-%d %H:%M:%S",
              )

              for fmt in formats:
                  try:
                      return datetime.strptime(value, fmt).replace(tzinfo=SL)
                  except ValueError:
                      pass

              try:
                  dt = datetime.fromisoformat(value.replace("Z", "+00:00"))
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=SL)
                  return dt.astimezone(SL)
              except ValueError:
                  return None

          def latest_observation(stations):
              parsed = []
              for station in stations:
                  raw = station["weather"].get("lastUpdated")
                  dt = parse_time(raw)
                  if dt:
                      parsed.append(dt)
              return max(parsed) if parsed else None

          def current_target(now):
              # Targets repeat every three hours across midnight.
              # A target remains active for three hours; publication
              # may happen at any time inside that window.
              today = now.replace(hour=0, minute=0, second=0, microsecond=0)
              candidates = []

              for offset in (-1, 0, 1):
                  day = today + timedelta(days=offset)
                  for minute in TARGET_MINUTES:
                      target = day + timedelta(minutes=minute)
                      if target <= now < target + timedelta(minutes=WINDOW_MINUTES):
                          candidates.append(target)

              if not candidates:
                  return None
              return max(candidates)

          def load_previous():
              try:
                  with OUTPUT.open("r", encoding="utf-8") as f:
                      obj = json.load(f)
                  if isinstance(obj, dict) and isinstance(obj.get("stations"), list):
                      return obj
              except (OSError, json.JSONDecodeError):
                  pass
              return None

          now_utc = datetime.now(UTC)
          now_sl = now_utc.astimezone(SL)
          previous = load_previous()
          target = current_target(now_sl)

          print("Sri Lanka time:", now_sl.isoformat())
          print("Target window:", target.isoformat() if target else "none")
          print("Official URL:", URL)

          # Manual dispatch deliberately bypasses the target-window gate.
          manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"

          if target is None and not manual:
              print("Outside a target update window; skipping fetch.")
              sys.exit(0)

          request = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": "AerisWeatherCollector/1.0",
                  "Accept": "text/html",
                  "Cache-Control": "no-cache",
                  "Pragma": "no-cache",
              },
          )

          html = None
          last_error = None

          for attempt in range(1, 3):
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      html = response.read().decode("utf-8", errors="replace")
                  if not html.strip():
                      raise RuntimeError("Official site returned an empty page")
                  break
              except Exception as exc:
                  last_error = exc
                  print(f"Fetch attempt {attempt}/2 failed: {exc}", file=sys.stderr)
                  if attempt < 2:
                      time.sleep(3)

          if html is None:
              raise RuntimeError(f"Unable to fetch official site: {last_error}")

          parser = WeatherParser()
          parser.feed(html)
          parser.close()

          unique = {}
          for station in parser.stations:
              unique[station["name"].strip().casefold()] = station

          stations = sorted(unique.values(), key=lambda s: s["name"].casefold())

          if not stations:
              raise RuntimeError(
                  "No valid station observations were parsed; "
                  "existing JSON has been preserved."
              )

          latest = latest_observation(stations)
          old_latest = latest_observation(previous.get("stations", [])) if previous else None

          print("Parsed stations:", len(stations))
          print("Latest source observation:", latest.isoformat() if latest else "unparseable")
          print("Previous latest observation:", old_latest.isoformat() if old_latest else "unknown")

          # Require parseable source timestamps to establish that data is
          # newer. Never replace a known timestamped dataset with older data.
          if latest is None:
              raise RuntimeError(
                  "No parseable source observation timestamps; "
                  "existing JSON has been preserved."
              )

          if old_latest is not None and latest < old_latest:
              print("Source observations are older than the saved data; preserving JSON.")
              sys.exit(0)

          # If the source still serves the same observation, leave the file
          # untouched. The next scheduled run will retry in five minutes.
          if old_latest is not None and latest <= old_latest:
              print("No newer official observation yet; will retry in five minutes.")
              sys.exit(0)

          fetched_utc = datetime.now(UTC)
          fetched_sl = fetched_utc.astimezone(SL)

          result = {
              "source": URL,
              "fetchedAt": fetched_utc.isoformat(),
              "fetchedAtSriLanka": fetched_sl.isoformat(),
              "fetchedAtSriLankaDisplay": fetched_sl.strftime("%Y-%m-%d %H:%M:%S"),
              "timezone": "Asia/Colombo",
              "stationCount": len(stations),
              "meteoLatestObservationUpdatedAt": latest.strftime("%Y-%m-%d %H:%M:%S"),
              "meteoLatestObservationUpdatedAtSriLanka": latest.isoformat(),
              "stations": stations,
          }

          OUTPUT.parent.mkdir(parents=True, exist_ok=True)
          temp = OUTPUT.with_suffix(".json.tmp")

          with temp.open("w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
              f.write("\n")

          # Validate the temporary file before replacing the existing file.
          with temp.open("r", encoding="utf-8") as f:
              checked = json.load(f)

          if not checked.get("stations") or checked.get("stationCount") != len(checked["stations"]):
              temp.unlink(missing_ok=True)
              raise RuntimeError("JSON validation failed; existing file preserved.")

          os.replace(temp, OUTPUT)

          print("Updated:", OUTPUT)
          print("New observation:", latest.isoformat())
          print("Station count:", len(stations))
          PY

      - name: Commit and push changed JSON
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/meteo.json

          if git diff --cached --quiet; then
            echo "No new valid observation was published; no commit needed."
            exit 0
          fi

          git commit -m "Update official Sri Lanka weather observations"

          # Retry a non-fast-forward push safely, without force-pushing.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Weather JSON successfully pushed to main."
              exit 0
            fi

            echo "Push attempt ${attempt}/3 failed; syncing with main."
            git fetch origin main
            git rebase origin/main

            if [ "$attempt" -lt 3 ]; then
              sleep 2
            fi
          done

          echo "Could not push the weather update after three attempts." >&2
          exit 1
