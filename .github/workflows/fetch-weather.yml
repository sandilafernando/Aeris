
name: Sri Lanka Meteorology Collector

on:
  schedule:
    - cron: '23 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aeris-meteo-collector
  cancel-in-progress: false

jobs:
  collect:
    # Run on your Ubuntu server in Proxmox.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install requests openpyxl

      - name: Fetch official meteorological data
        env:
          METEO_URL: 'https://meteo.gov.lk/excels/3hourly.xlsx?'
          OUTPUT_FILE: data/meteo.json
          MAX_RETRIES: '3'
        run: python scripts/meteo_collector.py

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/meteo.json")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("ERROR: Output file is missing or empty")

          with path.open(encoding="utf-8") as f:
              data = json.load(f)

          if not data:
              raise SystemExit("ERROR: JSON contains no data")

          print("JSON validation passed.")
          PY

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/meteo.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Sri Lanka meteorological observations"
            git push origin HEAD:main
          fi
