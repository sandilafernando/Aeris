
name: Fetch Sri Lanka Weather Observations

on:
  schedule:
    # Run every 30 minutes (UTC).
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-sri-lanka-weather
  cancel-in-progress: false

jobs:
  fetch-weather:
    name: Fetch official meteorological observations
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Fetch and parse official weather observations
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data

          python3 <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request
          from datetime import datetime
          from html.parser import HTMLParser
          from pathlib import Path
          from zoneinfo import ZoneInfo

          URL = "https://meteo.gov.lk/"
          OUTPUT = Path("data/meteo.json")
          SL_TZ = ZoneInfo("Asia/Colombo")

          class WeatherParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stations = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "div":
                      return

                  attrs = dict(attrs)
                  classes = (attrs.get("class") or "").split()

                  if "district-point" not in classes:
                      return

                  name = (attrs.get("data-name") or "").strip()
                  raw_weather = attrs.get("data-weather")

                  if not name or not raw_weather:
                      return

                  try:
                      weather = json.loads(raw_weather)
                  except (json.JSONDecodeError, TypeError):
                      print(
                          f"Skipping invalid weather JSON for {name}",
                          file=sys.stderr
                      )
                      return

                  if not isinstance(weather, dict):
                      return

                  allowed_fields = (
                      "lastUpdated",
                      "rainfall",
                      "totalRainfall",
                      "temp",
                      "rh",
                      "forecast",
                  )

                  cleaned = {
                      key: weather[key]
                      for key in allowed_fields
                      if key in weather and weather[key] is not None
                  }

                  if cleaned:
                      self.stations.append({
                          "name": name,
                          "weather": cleaned,
                      })

          def parse_observation_time(value):
              if not value:
                  return None

              value = str(value).strip()

              formats = (
                  "%Y-%m-%d %H%M",
                  "%Y-%m-%d %H:%M",
                  "%Y-%m-%d %H:%M:%S",
              )

              for fmt in formats:
                  try:
                      dt = datetime.strptime(value, fmt)
                      return dt.replace(tzinfo=SL_TZ)
                  except ValueError:
                      pass

              try:
                  dt = datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  )

                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=SL_TZ)

                  return dt.astimezone(SL_TZ)
              except ValueError:
                  return None

          # Fetch the official homepage, retrying temporary failures.
          html = None
          last_error = None

          request = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": "AerisWeatherCollector/1.0",
                  "Accept": "text/html",
              },
          )

          for attempt in range(1, 4):
              try:
                  with urllib.request.urlopen(
                      request, timeout=30
                  ) as response:
                      html = response.read().decode(
                          "utf-8", errors="replace"
                      )
                  break
              except Exception as exc:
                  last_error = exc
                  print(
                      f"Fetch attempt {attempt}/3 failed: {exc}",
                      file=sys.stderr
                  )
                  if attempt < 3:
                      time.sleep(3 * attempt)

          if html is None:
              raise RuntimeError(
                  f"Could not fetch {URL}: {last_error}"
              )

          # Record fetch time after successfully receiving the page.
          fetched_utc = datetime.now(
              ZoneInfo("UTC")
          )
          fetched_sl = fetched_utc.astimezone(SL_TZ)

          parser = WeatherParser()
          parser.feed(html)
          parser.close()

          # Keep one entry per station name.
          unique = {}
          for station in parser.stations:
              unique[station["name"].upper()] = station

          stations = sorted(
              unique.values(),
              key=lambda station: station["name"]
          )

          # Never overwrite valid data with an empty or invalid scrape.
          if not stations:
              raise RuntimeError(
                  "No station observations were found. "
                  "Existing data/meteo.json was not changed."
              )

          observation_times = []

          for station in stations:
              raw_time = station["weather"].get("lastUpdated")
              parsed_time = parse_observation_time(raw_time)

              if parsed_time:
                  observation_times.append(
                      (parsed_time, str(raw_time))
                  )

          latest_raw = None
          latest_sl = None

          if observation_times:
              latest_dt, latest_raw = max(
                  observation_times,
                  key=lambda item: item[0]
              )
              latest_sl = latest_dt.isoformat()

          result = {
              "source": URL,
              "fetchedAt": fetched_utc.isoformat(),
              "fetchedAtSriLanka": fetched_sl.isoformat(),
              "fetchedAtSriLankaDisplay": fetched_sl.strftime(
                  "%Y-%m-%d %H:%M:%S"
              ),
              "timezone": "Asia/Colombo",
              "stationCount": len(stations),
              "meteoLatestObservationUpdatedAt": latest_raw,
              "meteoLatestObservationUpdatedAtSriLanka": latest_sl,
              "stations": stations,
          }

          OUTPUT.parent.mkdir(parents=True, exist_ok=True)

          # Write atomically so a partial write cannot corrupt the file.
          temp_output = OUTPUT.with_suffix(".json.tmp")

          with temp_output.open("w", encoding="utf-8") as file:
              json.dump(
                  result,
                  file,
                  ensure_ascii=False,
                  indent=2
              )
              file.write("\n")

          os.replace(temp_output, OUTPUT)

          # Validate the saved JSON.
          with OUTPUT.open("r", encoding="utf-8") as file:
              saved = json.load(file)

          if not saved.get("stations"):
              raise RuntimeError("Saved JSON contains no stations.")

          print(f"Source: {URL}")
          print(f"Stations collected: {len(stations)}")
          print(
              "Fetched from server (Sri Lanka time): "
              f"{result['fetchedAtSriLankaDisplay']}"
          )
          print(
              "Latest source observation timestamp: "
              f"{latest_raw or 'Not supplied by source'}"
          )
          print(
              "Latest parsed observation time (Sri Lanka): "
              f"{latest_sl or 'Could not parse source timestamp'}"
          )
          print(f"Output: {OUTPUT}")
          PY

      - name: Commit updated weather data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/meteo.json

          if git diff --cached --quiet; then
            echo "Weather data did not change; no commit required."
            exit 0
          fi

          git commit -m "Update official Sri Lanka weather observations"
          git push origin HEAD:main
