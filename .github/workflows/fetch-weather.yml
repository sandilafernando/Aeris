name: Fetch Sri Lanka Weather Observations

on:
  schedule:
    # Check every five minutes, 24 hours a day.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-sri-lanka-weather
  cancel-in-progress: false

jobs:
  fetch-weather:
    name: Fetch and publish official weather observations
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 4

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch, validate and merge station observations
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request
          from datetime import datetime, timedelta
          from html.parser import HTMLParser
          from pathlib import Path
          from zoneinfo import ZoneInfo

          URL = "https://meteo.gov.lk/"
          OUTPUT = Path("data/meteo.json")
          SL = ZoneInfo("Asia/Colombo")
          UTC = ZoneInfo("UTC")

          # Target publication times in Sri Lanka time.
          # The site may publish late, so keep checking every five minutes.
          TARGET_MINUTES = (150, 330, 510, 690, 870, 1050, 1230, 1410)
          WINDOW_MINUTES = 180

          class WeatherParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stations = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "div":
                      return

                  attrs = dict(attrs)
                  classes = (attrs.get("class") or "").split()

                  if "district-point" not in classes:
                      return

                  name = (attrs.get("data-name") or "").strip()
                  raw = attrs.get("data-weather")

                  if not name or not raw:
                      return

                  try:
                      weather = json.loads(raw)
                  except (json.JSONDecodeError, TypeError):
                      print(f"Invalid weather JSON for station: {name}")
                      return

                  if not isinstance(weather, dict):
                      return

                  allowed = (
                      "lastUpdated",
                      "rainfall",
                      "totalRainfall",
                      "temp",
                      "rh",
                      "forecast",
                  )

                  cleaned = {
                      key: weather[key]
                      for key in allowed
                      if key in weather and weather[key] is not None
                  }

                  if cleaned:
                      self.stations.append({
                          "name": name,
                          "weather": cleaned,
                      })

          def parse_time(value):
              if value is None:
                  return None

              value = str(value).strip()

              formats = (
                  "%Y-%m-%d %H%M",
                  "%Y-%m-%d %H:%M",
                  "%Y-%m-%d %H:%M:%S",
              )

              for fmt in formats:
                  try:
                      return datetime.strptime(value, fmt).replace(tzinfo=SL)
                  except ValueError:
                      pass

              try:
                  dt = datetime.fromisoformat(value.replace("Z", "+00:00"))
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=SL)
                  return dt.astimezone(SL)
              except ValueError:
                  return None

          def station_map(stations):
              result = {}
              for station in stations:
                  if not isinstance(station, dict):
                      continue

                  name = str(station.get("name") or "").strip()
                  weather = station.get("weather")

                  if name and isinstance(weather, dict):
                      result[name.casefold()] = {
                          "name": name,
                          "weather": weather,
                      }

              return result

          def latest_observation(stations):
              times = [
                  parse_time(station["weather"].get("lastUpdated"))
                  for station in stations
                  if isinstance(station.get("weather"), dict)
              ]
              times = [value for value in times if value is not None]
              return max(times) if times else None

          def current_target(now):
              midnight = now.replace(
                  hour=0, minute=0, second=0, microsecond=0
              )
              candidates = []

              for offset in (-1, 0, 1):
                  day = midnight + timedelta(days=offset)
                  for minute in TARGET_MINUTES:
                      target = day + timedelta(minutes=minute)
                      if target <= now < target + timedelta(
                          minutes=WINDOW_MINUTES
                      ):
                          candidates.append(target)

              return max(candidates) if candidates else None

          def load_previous():
              try:
                  with OUTPUT.open("r", encoding="utf-8") as file:
                      obj = json.load(file)

                  if (
                      isinstance(obj, dict)
                      and isinstance(obj.get("stations"), list)
                  ):
                      return obj

              except (OSError, json.JSONDecodeError) as exc:
                  print(f"Could not load previous JSON: {exc}")

              return None

          now = datetime.now(UTC).astimezone(SL)
          previous = load_previous()
          target = current_target(now)
          manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"

          print("Sri Lanka time:", now.isoformat())
          print("Target window:", target.isoformat() if target else "none")
          print("Manual run:", manual)
          print("Source:", URL)

          if target is None and not manual:
              print("Outside an update window; skipping.")
              sys.exit(0)

          request = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": "AerisWeatherCollector/1.0",
                  "Accept": "text/html",
                  "Cache-Control": "no-cache",
                  "Pragma": "no-cache",
              },
          )

          html = None
          last_error = None

          for attempt in range(1, 3):
              try:
                  with urllib.request.urlopen(
                      request, timeout=20
                  ) as response:
                      html = response.read().decode(
                          "utf-8", errors="replace"
                      )

                  if not html.strip():
                      raise RuntimeError("Official website returned an empty page")

                  break

              except Exception as exc:
                  last_error = exc
                  print(f"Fetch attempt {attempt}/2 failed: {exc}")

                  if attempt < 2:
                      time.sleep(3)

          if html is None:
              raise RuntimeError(f"Official website fetch failed: {last_error}")

          parser = WeatherParser()
          parser.feed(html)
          parser.close()

          incoming = {}
          for station in parser.stations:
              key = station["name"].strip().casefold()
              incoming[key] = station

          if not incoming:
              raise RuntimeError(
                  "No valid stations found; previous JSON was preserved."
              )

          old_stations = station_map(
              previous.get("stations", []) if previous else []
          )

          incoming_list = list(incoming.values())
          incoming_latest = latest_observation(incoming_list)

          if incoming_latest is None:
              raise RuntimeError(
                  "No parseable source observation timestamps; "
                  "previous JSON was preserved."
              )

          print("Stations received:", len(incoming))
          print("Latest source observation:", incoming_latest.isoformat())

          merged = dict(old_stations)
          changed_stations = []
          rejected_older = 0

          for key, new_station in incoming.items():
              old_station = old_stations.get(key)

              if old_station is None:
                  merged[key] = new_station
                  changed_stations.append(new_station["name"])
                  continue

              old_weather = old_station["weather"]
              new_weather = new_station["weather"]

              old_time = parse_time(old_weather.get("lastUpdated"))
              new_time = parse_time(new_weather.get("lastUpdated"))

              # Never replace a known, timestamped reading with an older
              # reading. Keep the prior record for this station.
              if old_time and (new_time is None or new_time < old_time):
                  rejected_older += 1
                  continue

              # Same timestamp is allowed: other fields, such as rainfall,
              # may have changed. Compare the complete station payload.
              if new_weather != old_weather:
                  merged[key] = new_station
                  changed_stations.append(new_station["name"])

          if rejected_older:
              print("Older station readings preserved:", rejected_older)

          stations = sorted(
              merged.values(),
              key=lambda station: station["name"].casefold()
          )

          latest = latest_observation(stations)

          if latest is None:
              raise RuntimeError(
                  "Merged data has no valid observation timestamp."
              )

          # Do not rewrite fetchedAt on every five-minute check.
          # A commit should represent a meaningful station-data change.
          if previous and not changed_stations:
              print("No station data changed. Existing JSON preserved.")
              print("The next scheduled check will retry in five minutes.")
              sys.exit(0)

          fetched_utc = datetime.now(UTC)
          fetched_sl = fetched_utc.astimezone(SL)

          result = {
              "source": URL,
              "fetchedAt": fetched_utc.isoformat(),
              "fetchedAtSriLanka": fetched_sl.isoformat(),
              "fetchedAtSriLankaDisplay": fetched_sl.strftime(
                  "%Y-%m-%d %H:%M:%S"
              ),
              "timezone": "Asia/Colombo",
              "stationCount": len(stations),
              "meteoLatestObservationUpdatedAt": latest.strftime(
                  "%Y-%m-%d %H:%M:%S"
              ),
              "meteoLatestObservationUpdatedAtSriLanka": latest.isoformat(),
              "stations": stations,
          }

          OUTPUT.parent.mkdir(parents=True, exist_ok=True)
          temp = OUTPUT.with_suffix(".json.tmp")

          try:
              with temp.open("w", encoding="utf-8") as file:
                  json.dump(result, file, ensure_ascii=False, indent=2)
                  file.write("\n")

              with temp.open("r", encoding="utf-8") as file:
                  checked = json.load(file)

              if not isinstance(checked.get("stations"), list):
                  raise RuntimeError("Invalid stations array")

              if not checked["stations"]:
                  raise RuntimeError("Saved JSON would contain no stations")

              if checked.get("stationCount") != len(checked["stations"]):
                  raise RuntimeError("Station count validation failed")

              if not checked.get("meteoLatestObservationUpdatedAtSriLanka"):
                  raise RuntimeError("Missing latest observation timestamp")

              # Atomic replacement: the previous JSON remains intact if
              # fetching or validation fails.
              os.replace(temp, OUTPUT)

          finally:
              if temp.exists():
                  temp.unlink()

          print("JSON updated:", OUTPUT)
          print("Changed stations:", ", ".join(changed_stations))
          print("Total stations retained:", len(stations))
          print("Fetch time Sri Lanka:", result["fetchedAtSriLankaDisplay"])
          print("Latest observation:", latest.isoformat())
          PY

      - name: Commit and push updated JSON
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/meteo.json

          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
            exit 0
          fi

          git commit -m "Update official Sri Lanka weather observations"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Updated data/meteo.json pushed to main."
              exit 0
            fi

            echo "Push attempt ${attempt}/3 failed; syncing with main."
            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase failed. Manual conflict resolution is required." >&2
              exit 1
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 2
            fi
          done

          echo "Unable to push weather update after three attempts." >&2
          exit 1
